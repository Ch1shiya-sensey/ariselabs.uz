<!DOCTYPE html>
<html lang="uz" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Modullar — AriseLabs</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/main.css">
<link rel="stylesheet" href="../css/dashboard.css">
<style>
.topic-section{margin-bottom:32px}
.topic-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.topic-icon{font-size:28px}
.topic-name{font-size:20px;font-weight:800}
.topic-count{font-size:13px;color:var(--text3);font-family:var(--mono)}
.modules-big-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.mbg-card{background:var(--card);border:1.5px solid var(--border);border-radius:16px;padding:18px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.mbg-card::after{content:'';position:absolute;left:0;top:0;bottom:0;width:3px}
.mbg-card.grammar::after{background:var(--purple)}
.mbg-card.vocabulary::after{background:var(--green)}
.mbg-card.reading::after{background:var(--yellow)}
.mbg-card.mixed::after{background:#60a5fa}
.mbg-card:hover{border-color:var(--border-h);transform:translateY(-3px);box-shadow:var(--shadow)}
.mbg-card.locked{opacity:.55;cursor:default}
.mbg-card.locked:hover{transform:none;box-shadow:none;border-color:var(--border)}
.mbg-num{font-family:var(--mono);font-size:11px;color:var(--text3);margin-bottom:8px}
.mbg-title{font-size:15px;font-weight:700;margin-bottom:4px}
.mbg-subtopics{font-size:12px;color:var(--text3);margin-bottom:12px;line-height:1.5}
.mbg-meta{display:flex;justify-content:space-between;align-items:center}
.mbg-q{font-size:12px;color:var(--text2)}
.mbg-btn{font-size:13px;font-weight:700;color:var(--purple)}
</style>
</head>
<body class="page-body">
<script src="../js/theme.js"></script>

<div class="dash-wrap">
<aside class="sidebar" id="sidebar">
  <a href="dashboard.html" class="sb-logo">Arise<span>Labs</span></a>
  <nav class="sb-nav">
    <a href="dashboard.html" class="sb-link"><span class="sb-icon">🏠</span>Dashboard</a>
    <a href="tests.html"     class="sb-link"><span class="sb-icon">📝</span>Mock Testlar</a>
    <a href="modules.html"   class="sb-link active"><span class="sb-icon">📚</span>Modullar</a>
    <a href="results.html"   class="sb-link"><span class="sb-icon">📊</span>Natijalar</a>
    <a href="profile.html"   class="sb-link"><span class="sb-icon">👤</span>Profil</a>
  </nav>
  <div class="sb-bottom">
    <div class="sb-plan-chip"><span class="sb-plan-badge planBadge">FREE</span><span class="sb-plan-info userName">—</span></div>
    <button class="sb-logout" onclick="logout()">← Chiqish</button>
  </div>
</aside>

<div class="dash-main">
  <div class="topbar">
    <div class="topbar-left">
      <button class="burger-sb" onclick="toggleSidebar()">☰</button>
      <div class="topbar-title" data-uz="Modullar" data-ru="Модули">Modullar</div>
    </div>
    <div class="topbar-right">
      <div class="lang-toggle">
        <button class="lang-btn active" id="langUZ" onclick="setLang('uz')">UZ</button>
        <button class="lang-btn" id="langRU" onclick="setLang('ru')">RU</button>
      </div>
      <button class="theme-toggle" onclick="toggleTheme()"><span id="themeIcon">☀</span></button>
      <div class="topbar-user"><span class="userName">—</span><div class="user-av userInitial">U</div></div>
    </div>
  </div>

  <div class="dash-content">
    <div class="dc-inner">

      <!-- GRAMMAR -->
      <div class="topic-section">
        <div class="topic-head">
          <span class="topic-icon">✏️</span>
          <span class="topic-name" data-uz="Grammar" data-ru="Грамматика">Grammar</span>
          <span class="topic-count">Module 1–10 · 300 savol</span>
        </div>
        <div class="modules-big-grid" id="grammarGrid"></div>
      </div>

      <!-- VOCABULARY -->
      <div class="topic-section">
        <div class="topic-head">
          <span class="topic-icon">📖</span>
          <span class="topic-name" data-uz="Vocabulary" data-ru="Лексика">Vocabulary</span>
          <span class="topic-count">Module 11–14 · 120 savol</span>
        </div>
        <div class="modules-big-grid" id="vocabGrid"></div>
      </div>

      <!-- READING -->
      <div class="topic-section">
        <div class="topic-head">
          <span class="topic-icon">📄</span>
          <span class="topic-name" data-uz="Reading" data-ru="Чтение">Reading</span>
          <span class="topic-count">Module 15–17 · 90 savol</span>
        </div>
        <div class="modules-big-grid" id="readingGrid"></div>
      </div>

      <!-- MOCK -->
      <div class="topic-section">
        <div class="topic-head">
          <span class="topic-icon">📝</span>
          <span class="topic-name" data-uz="Mock Testlar" data-ru="Мок-тесты">Mock Testlar</span>
          <span class="topic-count">Module 18–20 · 90 savol</span>
        </div>
        <div class="modules-big-grid" id="mockGrid"></div>
      </div>

    </div>
  </div>
</div>
</div>

<div class="ai-chat-fab"><button class="ai-fab-btn" onclick="toggleChat()">🤖</button></div>
<div class="ai-chat-box" id="aiChatBox">
  <div class="ai-chat-header"><span class="ai-dot"></span><span>AI Yordamchi</span><button onclick="toggleChat()">✕</button></div>
  <div class="ai-messages" id="chatMessages"><div class="ai-msg bot">Savol bering! 🎓</div></div>
  <div class="ai-chat-input"><input type="text" id="chatInput" placeholder="Savol bering..."><button onclick="sendChatMsg()">→</button></div>
</div>

<script src="../js/lang.js"></script>
<script src="../js/dashboard.js"></script>
<script>
const isPro = session?.plan === 'pro';

const ALL_MODS = [
  {n:1,tag:'grammar',title:'Present Tenses',plan:'free',sub:'Present Simple · Continuous · Perfect · Perfect Continuous'},
  {n:2,tag:'grammar',title:'Past Tenses',plan:'free',sub:'Past Simple · Continuous · Perfect · Perfect Continuous'},
  {n:3,tag:'grammar',title:'Future Tenses',plan:'pro',sub:'Will · Going to · Future Continuous · Future Perfect'},
  {n:4,tag:'grammar',title:'Modal Verbs',plan:'pro',sub:'Can · Must · Should · May · Might · Could'},
  {n:5,tag:'grammar',title:'Conditionals',plan:'pro',sub:'Zero · First · Second · Third · Mixed Conditionals'},
  {n:6,tag:'grammar',title:'Passive Voice',plan:'pro',sub:'All tenses passive · Modal passives'},
  {n:7,tag:'grammar',title:'Relative Clauses',plan:'pro',sub:'Who · Which · That · Whose · Where · When'},
  {n:8,tag:'grammar',title:'Reported Speech',plan:'pro',sub:'Statements · Questions · Commands · Backshift'},
  {n:9,tag:'grammar',title:'Articles',plan:'pro',sub:'A / An · The · Zero article · Rules'},
  {n:10,tag:'grammar',title:'Prepositions',plan:'pro',sub:'Time · Place · Movement · Fixed prepositions'},
  {n:11,tag:'vocabulary',title:'Synonyms & Antonyms',plan:'pro',sub:'Common DTM vocabulary pairs'},
  {n:12,tag:'vocabulary',title:'Word Formation',plan:'pro',sub:'Prefixes · Suffixes · Conversion'},
  {n:13,tag:'vocabulary',title:'Phrasal Verbs',plan:'pro',sub:'30 essential DTM phrasal verbs'},
  {n:14,tag:'vocabulary',title:'Vocabulary DTM',plan:'pro',sub:'Collocations · Academic words · Common mistakes'},
  {n:15,tag:'reading',title:'Reading: Main Idea',plan:'pro',sub:'Identify topic sentence · Main purpose'},
  {n:16,tag:'reading',title:'Reading: Details',plan:'pro',sub:'Specific facts · Numbers · Dates'},
  {n:17,tag:'reading',title:'Reading: Inference',plan:'pro',sub:'Implied meaning · What can be inferred'},
  {n:18,tag:'mixed',title:'Mixed Mock Test 1',plan:'pro',sub:'Grammar + Vocabulary + Reading · DTM format'},
  {n:19,tag:'mixed',title:'Mixed Mock Test 2',plan:'pro',sub:'Advanced level · All topics mixed'},
  {n:20,tag:'mixed',title:'Mixed Mock Test 3',plan:'pro',sub:'Final preparation · DTM style'},
];

function renderGroup(mods, gridId) {
  const grid = document.getElementById(gridId);
  if (!grid) return;
  grid.innerHTML = mods.map(m => {
    const locked = m.plan==='pro' && !isPro;
    return `<div class="mbg-card ${m.tag}${locked?' locked':''}" onclick="${locked?'location.href=\'payment.html\'':'startMod('+m.n+')'}">
      <div class="mbg-num">MODULE ${String(m.n).padStart(2,'0')} · ${m.plan==='free'?'BEPUL':'PRO'}</div>
      <div class="mbg-title">${locked?'🔒 ':'' }${m.title}</div>
      <div class="mbg-subtopics">${m.sub}</div>
      <div class="mbg-meta">
        <span class="mbg-q">30 savol · 30 daqiqa</span>
        <span class="mbg-btn">${locked?'Pro →':'Boshlash →'}</span>
      </div>
    </div>`;
  }).join('');
}

renderGroup(ALL_MODS.filter(m=>m.tag==='grammar'),    'grammarGrid');
renderGroup(ALL_MODS.filter(m=>m.tag==='vocabulary'),  'vocabGrid');
renderGroup(ALL_MODS.filter(m=>m.tag==='reading'),     'readingGrid');
renderGroup(ALL_MODS.filter(m=>m.tag==='mixed'),       'mockGrid');

function startMod(n) { location.href='test.html?mod='+n; }
</script>
</body>
</html>
